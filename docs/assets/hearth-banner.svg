<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">Hearth Companion</title>
  <desc id="description">Everyday independence. Family within reach. A warm illuminated home with a voice waveform, representing voice, care, and bounded agency.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102C32"/>
      <stop offset="1" stop-color="#071B21"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#F1BC76" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F1BC76" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="home" x2="0" y2="1">
      <stop stop-color="#F7CF97"/>
      <stop offset="1" stop-color="#CD9457"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" rx="24" fill="url(#background)"/>
  <circle cx="1290" cy="255" r="250" fill="url(#glow)"/>
  <g fill="none" stroke="#70B8B7" stroke-opacity=".12">
    <circle cx="1280" cy="260" r="195"/>
    <circle cx="1280" cy="260" r="238"/>
    <path d="M1040 260h480M1280 24v472"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
