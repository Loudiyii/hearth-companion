    <text x="138" y="88" fill="#A9C9C9" font-size="19" letter-spacing="4">A LITTLE HELP. A FULLER LIFE.</text>
    <text x="84" y="220" fill="#F5F3EC" font-size="88" font-weight="700" letter-spacing="-3">Hearth Companion</text>
    <text x="89" y="284" fill="#CEE0DC" font-size="33">Everyday independence. Family within reach.</text>
    <g font-size="18" letter-spacing="2" fill="#9FC3C1">
      <text x="89" y="389">VOICE</text>
      <circle cx="178" cy="382" r="3" fill="#E8B67C"/>
      <text x="202" y="389">CARE</text>
      <circle cx="283" cy="382" r="3" fill="#E8B67C"/>
      <text x="307" y="389">BOUNDED AGENCY</text>
    </g>
    <text x="89" y="456" fill="#8BAEAF" font-size="16">AI TINKERERS  /  AGENTS, EVERYWHERE  /  PARIS 2026</text>
  </g>
